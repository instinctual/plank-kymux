[package]
name = "kymux"
version = "0.1.0"
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
kycom = { path = "../kycom", optional = true }
kymux-types = { path = "../kymux-types" }
kynet = { path = "../kynet" }
kyproto = { path = "../kyproto" }
kywebsocket = { path = "../kywebsocket" }

[features]
ipc = ["dep:kycom"]

backend-quinn = ["kynet/kynet-quinn"]
backend-wtransport = ["kynet/kynet-wtransport"]
backend-webtransport-js = ["kynet/kynet-webtransport-js"]
backend-websocket-js = ["kywebsocket/kywebsocket-js"]
backend-actix-ws = ["kywebsocket/kywebsocket-actix-ws"]
