[package]
name = "kymux"
version = "0.1.0"
edition = { workspace = true }

[dependencies]
kycom = { path = "../kycom", optional = true }
kymux-types = { path = "../kymux-types" }
kynet = { path = "../kynet" }
kyproto = { path = "../kyproto" }

[features]
ipc = ["dep:kycom"]

backend-quinn = ["kynet/kynet-quinn"]
backend-wtransport = ["kynet/kynet-wtransport"]
backend-webtransport-js = ["kynet/kynet-webtransport-js"]
