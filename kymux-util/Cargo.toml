[package]
name = "kymux-util"
version = "0.1.0"
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
hex = { version = "0.4", optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23.31", optional = true, default-features = false, features = ["logging", "std", "tls12"] }
thiserror = "2.0"
tokio = "1.36"

[features]
cert = [
    "dep:hex",
    "dep:ring",
    "dep:rustls",
]
