[package]
name = "kywebsocket"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-ws = { version = "0.4.0", optional = true }
async-trait = "0.1.73"
bytes = "1.5.0"
kymux-types = { path = "../kymux-types" }
kymux-util = { path = "../kymux-util" }
js-sys = { version = "=0.3.77", optional = true }
log = "0.4.20"
thiserror = "1.0.58"
tokio = { version = "1.47.1", features = ["rt", "sync"] }
wasm-bindgen = { version = "0.2.87", optional = true }
wasm-bindgen-futures = { version = "0.4.37", optional = true }
web-sys = { version = "=0.3.77", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "MessageEvent",
    "WebSocket",
] }

[features]
default = []
kywebsocket-js = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
kywebsocket-actix-ws = [
    "dep:actix-ws",
]
