[package]
name = "kywebsocket"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-ws = { version = "0.4.0", optional = true }
async-trait = "0.1.73"
bytes = "1.5.0"
futures = { version = "0.3.34", optional = true }
hex = { version = "0.4.3", optional = true }
kymux-types = { path = "../kymux-types" }
kymux-util = { path = "../kymux-util" }
js-sys = { version = "=0.3.77", optional = true }
log = "0.4.20"
ring = { version = "0.17.14", optional = true }
rustls = { version = "0.23.31", optional = true, default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
thiserror = "1.0.58"
tokio = { version = "1.47.1", features = ["rt", "sync"] }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false }
tokio-tungstenite = { version = "0.30.0", optional = true }
wasm-bindgen = { version = "0.2.87", optional = true }
wasm-bindgen-futures = { version = "0.4.37", optional = true }
web-sys = { version = "=0.3.77", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "MessageEvent",
    "WebSocket",
] }

[features]
default = []
kywebsocket-js = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
kywebsocket-actix-ws = [
    "dep:actix-ws",
]
kywebsocket-tungstenite = [
    "dep:futures",
    "dep:hex",
    "dep:ring",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
    "kymux-util/cert",
    "tokio/net",
]
