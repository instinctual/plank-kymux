[package]
name = "kyproto"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
async-trait = "0.1.73"
byteorder = "1.4.3"
bytes = "1.4.0"
kymux-types = { path = "../kymux-types" }
kynet = { path = "../kynet" }
kymux-util = { path = "../kymux-util" }
kywasmtime = { git = "https://github.com/rom1v/kywasmtime.git", tag = "0.1", optional = true }
rustls = { version = "=0.23.31", optional = true, default-features = false, features = ["logging", "std", "tls12"] }
log = "0.4.20"
raptorq = "1.7.0"
rmp-serde = "1.1.2"
serde = { version = "1.0.188", features = ["derive"] }
thiserror = "1.0.47"
tokio = { version = "1.32.0", features = ["macros", "sync"] }

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
libc = "0.2.153"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = ["Win32_System_Performance"] }

# https://doc.rust-lang.org/cargo/reference/features.html#optional-dependencies
[features]
js = ["kynet/kynet-webtransport-js", "dep:kywasmtime"]
tokio-rt = ["tokio/rt"]
